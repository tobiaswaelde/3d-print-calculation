<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">Print cost workflow</title>
  <desc id="desc">Master data flows into an editable draft with a live calculation, then into an immutable completed snapshot that can be duplicated using current prices.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#0e7490"/></marker></defs>
  <g font-family="system-ui,sans-serif" font-size="15" text-anchor="middle">
    <g fill="#ecfeff" stroke="#0e7490" stroke-width="2">
      <rect x="20" y="50" width="150" height="80" rx="12"/><rect x="215" y="50" width="150" height="80" rx="12"/><rect x="410" y="50" width="150" height="80" rx="12"/><rect x="605" y="50" width="135" height="80" rx="12"/>
    </g>
    <g fill="#164e63"><text x="95" y="82">Master data</text><text x="95" y="106">Stammdaten</text><text x="290" y="82">Draft + preview</text><text x="290" y="106">Entwurf + Vorschau</text><text x="485" y="82">Completed snapshot</text><text x="485" y="106">Abschluss-Snapshot</text><text x="672" y="82">Duplicate</text><text x="672" y="106">Duplikat</text></g>
    <g stroke="#0e7490" stroke-width="3" marker-end="url(#arrow)"><path d="M170 90h38"/><path d="M365 90h38"/><path d="M560 90h38"/></g>
  </g>
</svg>
