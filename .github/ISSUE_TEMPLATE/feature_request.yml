name: Feature request
description: Suggest an improvement to the 3D print calculation workflow or operation of the application.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the underlying need before proposing implementation details.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find the same request.
          required: true
        - label: This request describes one focused problem or use case.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Calculation and completed snapshots
        - Print workflow
        - Inventory
        - Dashboard and search
        - Setup, login, and sessions
        - API and integrations
        - Docker and self-hosted operation
        - Localization
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and what prevents or complicates it today?
      placeholder: As a ... I want to ... because ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or workflow you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative solutions you have tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, mockups, or other context. Use synthetic data and remove sensitive information.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement or test this feature.
