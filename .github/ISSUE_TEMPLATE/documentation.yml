name: Documentation issue
description: Report missing, unclear, incorrect, or outdated documentation.
title: '[Docs]: '
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Use this form for the German or English documentation, the README, and operational guides.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true

  - type: dropdown
    id: kind
    attributes:
      label: Type of documentation issue
      options:
        - Incorrect information
        - Missing information
        - Unclear instructions
        - Outdated information
        - Broken link or example
        - Translation mismatch
        - Other
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link to the affected page or provide its repository path and section heading.
      placeholder: https://tobiaswaelde.github.io/3d-print-calculation/operations/deployment
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - German
        - English
        - Both languages
        - Not language-specific
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: Explain what made the documentation inaccurate, incomplete, or difficult to follow.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Describe the wording, example, or structure that would resolve the issue.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any relevant context or screenshots. Remove credentials, personal data, and other sensitive information.
