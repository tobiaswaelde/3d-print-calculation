services:
  app:
    image: ghcr.io/tobiaswaelde/3d-print-calculation:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/app.db
      NUXT_SESSION_TTL_HOURS: 168
      DATA_DIR: /data
    ports:
      - '3000:3000'
    volumes:
      - app-data:/data
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  app-data:
